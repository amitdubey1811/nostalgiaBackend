# ========================================
# Nostalgia API — Application Properties
# ========================================

# Application
app.name=nostalgia-api
app.version=0.0.1-SNAPSHOT
app.description=Backend API for Nostalgia platform

# Server
server.port=8080
server.servlet.context-path=/api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/nostalgia
spring.datasource.username=nostalgia_admin
spring.datasource.password=nostalgia123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# JWT
app.jwt.secret=nostalgia-jwt-secret-change-in-production
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Logging
logging.level.com.nostalgia=DEBUG
logging.level.org.springframework.security=DEBUG
